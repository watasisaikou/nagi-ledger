name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The hooks are developed on Windows but must run anywhere: several
        # bugs found in development were Windows-only (console codepage
        # mangling non-ASCII on stderr) or POSIX-only. Both are tested.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run test suite
        # Bare `pytest`, not `python -m pytest`: this proves the pythonpath
        # setting in pyproject.toml works, rather than relying on `-m`
        # putting the cwd on sys.path.
        run: pytest -q

      - name: Smoke-test the MCP server over stdio
        # Spawns server.py as a real subprocess and calls every tool through
        # an MCP client — proves the server actually serves, not just imports.
        run: python tests/smoke_stdio.py

  # A public repository is read by people who check these things before they
  # read the code. Both run on every push rather than on a schedule: a secret
  # is only cheap to remove before it is pushed, and an advisory nobody sees
  # until Friday is an advisory nobody acts on.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Secret scanning needs the history, not just the tip. A key removed
          # in a later commit is still published by the one that added it.
          fetch-depth: 0
      - name: Scan the full history for secrets
        uses: gitleaks/gitleaks-action@44c470ffc35caa8b1eb3e8012ca53c2f9bea4eb5  # v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt
